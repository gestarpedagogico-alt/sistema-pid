<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Cronograma de Estudos do PDI</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<form class="login-card" id="loginForm" novalidate>
  <div class="logo-badge">
    <img src="assets/img/logo.svg" alt="Norte Rios">
  </div>
  <h1>Cronograma de Estudos do PDI</h1>
  <p class="sub">Norte Rios · Acesso restrito</p>

  <div class="field">
    <label for="inpEmail">Seu e-mail</label>
    <input type="email" id="inpEmail" placeholder="nome@norterios.com.br" autocomplete="email" required autofocus>
  </div>
  <button type="submit" class="btn-primary">Entrar</button>

  <div class="error" id="errBox" hidden><b>Acesso negado.</b> Este e-mail não está registrado no sistema.</div>
  <p class="footnote">Somente e-mails autorizados pela coordenação têm acesso ao cronograma.</p>
</form>

<script src="js/login.js"></script>

</body>
</html>
